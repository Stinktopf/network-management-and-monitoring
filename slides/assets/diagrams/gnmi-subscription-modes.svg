<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="Adapted supplied gNMI subscription mode tree: SAMPLE, ON_CHANGE and TARGET_DEFINED belong to STREAM"><title>Adapted supplied gNMI subscription mode tree: SAMPLE, ON_CHANGE and TARGET_DEFINED belong to STREAM</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="20" y="27" font-size="25" text-anchor="start" font-weight="400" fill="#303030">SubscriptionList mode</text><rect x="20" y="50" width="320" height="88" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="180.0" y="78.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">ONCE</text><text dominant-baseline="central" x="180.0" y="110.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">one initial transfer</text><rect x="390" y="50" width="320" height="88" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="78.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">POLL</text><text dominant-baseline="central" x="550.0" y="110.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">client requests updates</text><rect x="760" y="50" width="320" height="88" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="920.0" y="78.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">STREAM</text><text dominant-baseline="central" x="920.0" y="110.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">continuing updates</text><path d="M920,150 V165 H180" fill="none" stroke="#888888" stroke-width="2" /><path d="M180,165 L180,197" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><rect x="20" y="210" width="320" height="88" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="180.0" y="238.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">SAMPLE</text><text dominant-baseline="central" x="180.0" y="270.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">periodic values</text><path d="M550,165 L550,197" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><rect x="390" y="210" width="320" height="88" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="238.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">ON_CHANGE</text><text dominant-baseline="central" x="550.0" y="270.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">value changes</text><path d="M920,165 L920,197" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><rect x="760" y="210" width="320" height="88" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="920.0" y="238.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">TARGET_DEFINED</text><text dominant-baseline="central" x="920.0" y="270.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">target selects mode</text></g></svg>