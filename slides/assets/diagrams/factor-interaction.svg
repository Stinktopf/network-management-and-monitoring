<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-label="Synthetic factorial example: component A reduces completion time under light load but increases it under heavy load"><title>Synthetic factorial example: component A reduces completion time under light load but increases it under heavy load</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><path d="M150,250 L790,250" fill="none" stroke="#888888" stroke-width="2" /><path d="M150,250 L150,30" fill="none" stroke="#888888" stroke-width="2" /><text x="150" y="20" font-size="23" text-anchor="start" fill="#303030" font-weight="400">Completion time (ms), lower is better</text><text x="125" y="258" font-size="22" text-anchor="end" fill="#303030" font-weight="400">0</text><path d="M150,250 L790,250" fill="none" stroke="#dddddd" stroke-width="2" /><text x="125" y="158" font-size="22" text-anchor="end" fill="#303030" font-weight="400">50</text><path d="M150,150 L790,150" fill="none" stroke="#dddddd" stroke-width="2" /><text x="125" y="58" font-size="22" text-anchor="end" fill="#303030" font-weight="400">100</text><path d="M150,50 L790,50" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M230,150 L690,50" fill="none" stroke="#303030" stroke-width="2" /><path d="M230,210 L690,30" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="8 6" /><circle cx="230" cy="150" r="6" fill="#303030" /><circle cx="690" cy="50" r="6" fill="#303030" /><rect x="225" y="205" width="10" height="10" fill="#888888" /><rect x="685" y="25" width="10" height="10" fill="#888888" /><text x="230" y="285" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Light workload</text><text x="690" y="285" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Heavy workload</text><text x="820" y="68" font-size="22" text-anchor="start" fill="#303030" font-weight="400">Without A: 50 → 100</text><text x="820" y="108" font-size="22" text-anchor="start" fill="#303030" font-weight="400">With A: 20 → 110</text><text x="820" y="174" font-size="24" text-anchor="start" fill="#303030" font-weight="700">Effect of A:</text><text x="820" y="211" font-size="24" text-anchor="start" fill="#303030" font-weight="400">−30 ms → +10 ms</text></g></svg>