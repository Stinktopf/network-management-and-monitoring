<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-label="A matched pair: reset and verify, run the first randomized method, reset and verify again, run the other method"><title>A matched pair: reset and verify, run the first randomized method, reset and verify again, run the other method</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="15" y="35" width="245" height="110" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="137.5" y="74.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Reset + check</text><text dominant-baseline="central" x="137.5" y="106.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Same initial state</text><path d="M263,90 L285,90" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><rect x="290" y="35" width="245" height="110" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="412.5" y="74.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Method A or B</text><text dominant-baseline="central" x="412.5" y="106.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Randomized first</text><path d="M538,90 L560,90" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><rect x="565" y="35" width="245" height="110" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="687.5" y="74.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Reset + check</text><text dominant-baseline="central" x="687.5" y="106.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Same initial state</text><path d="M813,90 L835,90" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><rect x="840" y="35" width="245" height="110" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="962.5" y="74.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Other method</text><text dominant-baseline="central" x="962.5" y="106.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Independent checks</text></g></svg>