<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="causal-alternatives"><title>causal-alternatives</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="380" y="10" width="340" height="78" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="49.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Common fault</text><rect x="20" y="185" width="330" height="85" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="185.0" y="227.5" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Router CPU rises</text><rect x="750" y="185" width="330" height="85" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="915.0" y="227.5" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">HTTP latency rises</text><path d="M420.40665406209985,93.97513875329707 L229.59334593790018,176.02486124670293" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><path d="M679.6270325110842,93.8948799807297 L880.3729674889158,176.1051200192703" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><path d="M360.0,225.0 L739.0,225.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" stroke-dasharray="7 6" /><text x="550" y="208" font-size="23" text-anchor="middle" font-weight="400" fill="#303030">Or a direct effect?</text><text x="550" y="316" font-size="24" text-anchor="middle" font-weight="400" fill="#303030">A shared cause can create correlation without a direct causal link.</text></g></svg>