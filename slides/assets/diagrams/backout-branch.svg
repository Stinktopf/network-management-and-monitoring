<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="307" viewBox="0 0 1100 307" role="img" aria-label="Explanatory course diagram"><title>Explanatory course diagram</title><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker><marker id="arrow-grey" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="380" y="15" width="340" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="50.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Service verification</text><rect x="80" y="160" width="380" height="76" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="270.0" y="198.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Pass: record + hand over</text><rect x="640" y="160" width="380" height="76" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="830.0" y="198.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Fail: backout + verify</text><path d="M455.2466715046719,91.55108614058075 L274.7533284953281,150.44891385941924" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><path d="M644.7533284953281,91.55108614058075 L825.2466715046719,150.44891385941924" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="550" y="281" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Rollback: configuration. Backout: recovery procedure.</text></g></svg>