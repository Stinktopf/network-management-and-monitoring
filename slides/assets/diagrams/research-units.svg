<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="295" viewBox="0 0 1100 295" role="img" aria-label="Three reset repair runs each contain many probe samples. Samples within a run are not independent repetitions of the repair."><title>Three reset repair runs each contain many probe samples. Samples within a run are not independent repetitions of the repair.</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="35" y="20" width="300" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="185.0" y="39.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Run 1</text><text dominant-baseline="central" x="185.0" y="71.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Fresh reset</text><path d="M185,95 L185,130" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><circle cx="65" cy="155" r="5" fill="#303030" /><circle cx="99" cy="155" r="5" fill="#303030" /><circle cx="133" cy="155" r="5" fill="#303030" /><circle cx="167" cy="155" r="5" fill="#303030" /><circle cx="201" cy="155" r="5" fill="#303030" /><circle cx="235" cy="155" r="5" fill="#303030" /><circle cx="269" cy="155" r="5" fill="#303030" /><circle cx="303" cy="155" r="5" fill="#303030" /><text x="185" y="205" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Many probe samples</text><rect x="400" y="20" width="300" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="39.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Run 2</text><text dominant-baseline="central" x="550.0" y="71.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Fresh reset</text><path d="M550,95 L550,130" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><circle cx="430" cy="155" r="5" fill="#303030" /><circle cx="464" cy="155" r="5" fill="#303030" /><circle cx="498" cy="155" r="5" fill="#303030" /><circle cx="532" cy="155" r="5" fill="#303030" /><circle cx="566" cy="155" r="5" fill="#303030" /><circle cx="600" cy="155" r="5" fill="#303030" /><circle cx="634" cy="155" r="5" fill="#303030" /><circle cx="668" cy="155" r="5" fill="#303030" /><text x="550" y="205" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Many probe samples</text><rect x="765" y="20" width="300" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="915.0" y="39.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Run 3</text><text dominant-baseline="central" x="915.0" y="71.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Fresh reset</text><path d="M915,95 L915,130" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><circle cx="795" cy="155" r="5" fill="#303030" /><circle cx="829" cy="155" r="5" fill="#303030" /><circle cx="863" cy="155" r="5" fill="#303030" /><circle cx="897" cy="155" r="5" fill="#303030" /><circle cx="931" cy="155" r="5" fill="#303030" /><circle cx="965" cy="155" r="5" fill="#303030" /><circle cx="999" cy="155" r="5" fill="#303030" /><circle cx="1033" cy="155" r="5" fill="#303030" /><text x="915" y="205" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Many probe samples</text><text x="550" y="265" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Replicate the intervention, not only the observation.</text></g></svg>