<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="305" viewBox="0 0 1100 305" role="img" aria-label="as-domains"><title>as-domains</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><ellipse cx="160" cy="160" rx="145" ry="64" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="160" y="144" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">Customer AS</text><text dominant-baseline="central" x="160" y="176" font-size="22" text-anchor="middle" font-weight="400" fill="#303030">Own routing policy</text><ellipse cx="550" cy="75" rx="145" ry="64" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550" y="59" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">Transit AS</text><text dominant-baseline="central" x="550" y="91" font-size="22" text-anchor="middle" font-weight="400" fill="#303030">Connects networks</text><ellipse cx="930" cy="160" rx="145" ry="64" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="930" y="144" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">Peer AS</text><text dominant-baseline="central" x="930" y="176" font-size="22" text-anchor="middle" font-weight="400" fill="#303030">Own routing policy</text><path d="M304.8719559784731,124.87570246650621 L412.1280440215269,100.12429753349379" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><path d="M694.8534193103208,103.20179906731752 L790.1465806896792,126.79820093268248" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><path d="M310,183 L780,183" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="7 6" /><text x="550" y="218" font-size="23" text-anchor="middle" font-weight="400" fill="#303030">Policy defines the relationship.</text><text x="550" y="279" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">An AS is an administrative boundary, not one router.</text></g></svg>