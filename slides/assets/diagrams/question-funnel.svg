<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-label="Narrow an interest through a problem and question to an explicit study scope"><title>Narrow an interest through a problem and question to an explicit study scope</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="25" y="47" font-size="24" text-anchor="start" fill="#303030" font-weight="700">Interest</text><text x="225" y="47" font-size="24" text-anchor="start" fill="#303030" font-weight="400">Automated repair</text><path d="M190,59 L190,89" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="25" y="119" font-size="24" text-anchor="start" fill="#303030" font-weight="700">Problem</text><text x="225" y="119" font-size="24" text-anchor="start" fill="#303030" font-weight="400">A successful command can leave the service broken</text><path d="M190,131 L190,161" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="25" y="191" font-size="24" text-anchor="start" fill="#303030" font-weight="700">Question</text><text x="225" y="191" font-size="24" text-anchor="start" fill="#303030" font-weight="400">Does independent verification reduce unsafe repairs?</text><path d="M190,203 L190,233" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="25" y="263" font-size="24" text-anchor="start" fill="#303030" font-weight="700">Scope</text><text x="225" y="263" font-size="24" text-anchor="start" fill="#303030" font-weight="400">Same incidents, fixed tool access, recovery and side effects</text></g></svg>