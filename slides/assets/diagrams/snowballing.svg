<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="Snowballing: search the references and citing papers of a relevant starting paper, screen new records, and repeat both searches for each eligible new paper"><title>Snowballing: search the references and citing papers of a relevant starting paper, screen new records, and repeat both searches for each eligible new paper</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="390" y="20" width="320" height="80" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="44.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Relevant starting paper</text><text dominant-baseline="central" x="550.0" y="76.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">From the keyword search</text><rect x="20" y="20" width="280" height="80" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="160.0" y="44.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Backward search</text><text dominant-baseline="central" x="160.0" y="76.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Read its references</text><rect x="800" y="20" width="280" height="80" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="940.0" y="44.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Forward search</text><text dominant-baseline="central" x="940.0" y="76.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Cited by: papers citing it</text><path d="M380.0,60.0 L310.0,60.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><path d="M720.0,60.0 L790.0,60.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><rect x="350" y="200" width="400" height="80" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="224.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Screen new papers</text><text dominant-baseline="central" x="550.0" y="256.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Keep relevant, unseen studies</text><path d="M160,105 L160,240" fill="none" stroke="#888888" stroke-width="2" /><path d="M165.0,240.0 L340.0,240.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><path d="M940,105 L940,240" fill="none" stroke="#888888" stroke-width="2" /><path d="M935.0,240.0 L760.0,240.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><path d="M550.0,190.0 L550.0,110.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="570" y="150" font-size="22" text-anchor="start" fill="#303030" font-weight="400">Repeat for each new match</text></g></svg>