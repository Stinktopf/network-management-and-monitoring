<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-label="Distance vector: neighbors advertise distances. A adds its link cost, selects B and advertises its own distance of two hops. Link state: routers flood local links and costs within the area, build the topology map and calculate shortest paths locally."><title>Distance vector: neighbors advertise distances. A adds its link cost, selects B and advertises its own distance of two hops. Link state: routers flood local links and costs within the area, build the topology map and calculate shortest paths locally.</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="25" y="35" font-size="27" text-anchor="start" font-weight="700" fill="#303030">Distance vector (RIP)</text><text x="595" y="35" font-size="27" text-anchor="start" font-weight="700" fill="#303030">Link state (OSPF)</text><path d="M550,10 L550,242" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M85,155 L260,155" fill="none" stroke="#888888" stroke-width="2" /><path d="M260,155 L450,155" fill="none" stroke="#888888" stroke-width="2" /><circle cx="85" cy="155" r="26" fill="#ffffff" stroke="#cccccc" stroke-width="2" /><text x="85" y="164" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">A</text><circle cx="260" cy="155" r="26" fill="#ffffff" stroke="#cccccc" stroke-width="2" /><text x="260" y="164" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">B</text><circle cx="450" cy="155" r="26" fill="#ffffff" stroke="#cccccc" stroke-width="2" /><text x="450" y="164" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">D</text><path d="M225.0,98.0 L119.0,98.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><text x="260" y="77" font-size="27" text-anchor="middle" font-weight="400" fill="#303030">B → A: “D is 1 hop away.”</text><path d="M635,155 L815,95" fill="none" stroke="#888888" stroke-width="3" /><text x="725.0" y="113.0" font-size="27" text-anchor="middle" font-weight="400" fill="#303030">1</text><path d="M815,95 L1040,155" fill="none" stroke="#888888" stroke-width="3" /><text x="927.5" y="113.0" font-size="27" text-anchor="middle" font-weight="400" fill="#303030">1</text><path d="M635,155 L815,215" fill="none" stroke="#888888" stroke-width="2" /><text x="725.0" y="173.0" font-size="27" text-anchor="middle" font-weight="400" fill="#303030">5</text><path d="M815,215 L1040,155" fill="none" stroke="#888888" stroke-width="2" /><text x="927.5" y="173.0" font-size="27" text-anchor="middle" font-weight="400" fill="#303030">2</text><circle cx="635" cy="155" r="26" fill="#ffffff" stroke="#cccccc" stroke-width="2" /><text x="635" y="164" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">A</text><circle cx="815" cy="95" r="26" fill="#ffffff" stroke="#cccccc" stroke-width="2" /><text x="815" y="104" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">B</text><circle cx="1040" cy="155" r="26" fill="#ffffff" stroke="#cccccc" stroke-width="2" /><text x="1040" y="164" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">D</text><circle cx="815" cy="215" r="26" fill="#ffffff" stroke="#cccccc" stroke-width="2" /><text x="815" y="224" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">C</text></g></svg>