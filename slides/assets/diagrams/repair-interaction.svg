<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="Illustrative interaction: immediate repair takes 10 seconds at low load and 30 at high load, prechecked repair takes 16 and 20 seconds. The preferred method changes with load."><title>Illustrative interaction: immediate repair takes 10 seconds at low load and 30 at high load, prechecked repair takes 16 and 20 seconds. The preferred method changes with load.</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="40" y="30" font-size="23" text-anchor="start" fill="#303030" font-weight="400">Mean recovery time (s)</text><path d="M150,255 L790,255" fill="none" stroke="#dddddd" stroke-width="2" /><text x="120" y="263" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">0</text><path d="M150,195 L790,195" fill="none" stroke="#dddddd" stroke-width="2" /><text x="120" y="203" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">10</text><path d="M150,135 L790,135" fill="none" stroke="#dddddd" stroke-width="2" /><text x="120" y="143" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">20</text><path d="M150,75 L790,75" fill="none" stroke="#dddddd" stroke-width="2" /><text x="120" y="83" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">30</text><text x="210" y="295" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Low load</text><text x="720" y="295" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">High load</text><path d="M210,195 L720,75" fill="none" stroke="#303030" stroke-width="2" /><circle cx="210" cy="195" r="7" fill="#303030" /><text x="210" y="179" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">10</text><circle cx="720" cy="75" r="7" fill="#303030" /><text x="720" y="59" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">30</text><path d="M850,72 L895,72" fill="none" stroke="#303030" stroke-width="2" /><text x="910" y="80" font-size="22" text-anchor="start" fill="#303030" font-weight="400">A: immediate</text><path d="M210,159 L720,135" fill="none" stroke="#888888" stroke-width="2" /><circle cx="210" cy="159" r="7" fill="#888888" /><text x="210" y="143" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">16</text><circle cx="720" cy="135" r="7" fill="#888888" /><text x="720" y="119" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">20</text><path d="M850,112 L895,112" fill="none" stroke="#888888" stroke-width="2" /><text x="910" y="120" font-size="22" text-anchor="start" fill="#303030" font-weight="400">B: prechecked</text><text x="900" y="210" font-size="21" text-anchor="middle" fill="#303030" font-weight="400">Illustrative values</text></g></svg>