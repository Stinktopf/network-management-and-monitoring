<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="315" viewBox="0 0 1100 315" role="img" aria-label="policy-order"><title>policy-order</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="255" y="35" font-size="29" text-anchor="middle" font-weight="700" fill="#303030">Before</text><rect x="25" y="70" width="470" height="68" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text x="47" y="113" font-size="27" text-anchor="start" font-weight="400" fill="#303030">1  permit site-local</text><rect x="25" y="158" width="470" height="68" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text x="47" y="201" font-size="27" text-anchor="start" font-weight="400" fill="#303030">2  reject remaining</text><text x="835" y="35" font-size="29" text-anchor="middle" font-weight="700" fill="#303030">After</text><rect x="605" y="70" width="470" height="68" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text x="627" y="113" font-size="27" text-anchor="start" font-weight="400" fill="#303030">1  reject remaining</text><rect x="605" y="158" width="470" height="68" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text x="627" y="201" font-size="23" text-anchor="start" font-weight="400" fill="#666666">2  permit site-local — not reached</text><path d="M510.0,150.0 L568.0,150.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><text x="550" y="288" font-size="24" text-anchor="middle" font-weight="400" fill="#303030">First matching rule wins. Later permission cannot undo rejection.</text></g><