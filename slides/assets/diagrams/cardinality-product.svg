<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="285" viewBox="0 0 1100 285" role="img" aria-label="ReefNet probe metric: two sources times two IP families times two probe types equals eight label combinations"><title>ReefNet probe metric: two sources times two IP families times two probe types equals eight label combinations</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="180" y="55" font-size="43" text-anchor="middle" font-weight="700" fill="#303030">2</text><text x="180" y="94" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">sources</text><text x="180" y="131" font-size="23" text-anchor="middle" font-weight="400" fill="#666666">Lagoon / Pacific</text><text x="365" y="76" font-size="34" text-anchor="middle" font-weight="400" fill="#666666">×</text><text x="550" y="55" font-size="43" text-anchor="middle" font-weight="700" fill="#303030">2</text><text x="550" y="94" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">IP families</text><text x="550" y="131" font-size="23" text-anchor="middle" font-weight="400" fill="#666666">IPv4 / IPv6</text><text x="735" y="76" font-size="34" text-anchor="middle" font-weight="400" fill="#666666">×</text><text x="920" y="55" font-size="43" text-anchor="middle" font-weight="700" fill="#303030">2</text><text x="920" y="94" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">probe types</text><text x="920" y="131" font-size="23" text-anchor="middle" font-weight="400" fill="#666666">ICMP / DNS</text><path d="M85,159 L1015,159" fill="none" stroke