<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="305" viewBox="0 0 1100 305" role="img" aria-label="neighbor-resolution"><title>neighbor-resolution</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="210" y="25" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">Host</text><text x="900" y="25" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">Next hop</text><path d="M210,44 L210,240" fill="none" stroke="#888888" stroke-width="2" /><path d="M900,44 L900,240" fill="none" stroke="#888888" stroke-width="2" /><path d="M221.0,95.0 L889.0,95.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><text x="555" y="77" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">Who owns this next-hop IP?</text><path d="M889.0,185.0 L221.0,185.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><text x="555" y="167" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">This link-layer address</text><text x="550" y="280" font-size="24" text-anchor="middle" font-weight="400" fill="#303030">ARP uses broadcast. ND uses multicast solicitation.</text></g></svg>