<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-label="Conceptual bias diagram: more runs narrow uncertainty around command completion, but command completion occurs before actual service recovery."><title>Conceptual bias diagram: more runs narrow uncertainty around command completion, but command completion occurs before actual service recovery.</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="550" y="30" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Target: actual service recovery time</text><path d="M700,55 L700,245" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="8 6" /><text x="30" y="113" font-size="24" text-anchor="start" fill="#303030" font-weight="400">Few runs</text><path d="M220,105 L650,105" fill="none" stroke="#888888" stroke-width="2" /><circle cx="435" cy="105" r="7" fill="#303030" /><text x="30" y="208" font-size="24" text-anchor="start" fill="#303030" font-weight="400">Many runs</text><path d="M360,200 L510,200" fill="none" stroke="#888888" stroke-width="2" /><circle cx="435" cy="200" r="7" fill="#303030" /><text x="435" y="270" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Command completion</text><text x="825" y="220" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Actual recovery</text><text x="550" y="325" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">A wrong endpoint stays wrong when measured more precisely.</text></g></svg>