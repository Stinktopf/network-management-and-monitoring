<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Three request examples and the server-to-client update direction within a Subscribe RPC; replies omitted"><title>Three request examples and the server-to-client update direction within a Subscribe RPC; replies omitted</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="120" y="30" font-size="28" text-anchor="middle" font-weight="700" fill="#303030">Client</text><text x="975" y="30" font-size="28" text-anchor="middle" font-weight="700" fill="#303030">gNMI target</text><path d="M120,50 L120,320" fill="none" stroke="#888888" stroke-width="2" /><path d="M975,50 L975,320" fill="none" stroke="#888888" stroke-width="2" /><path d="M132.0,90.0 L963.0,90.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><text x="550" y="78" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">Capabilities: discover supported models</text><path d="M132.0,160.0 L963.0,160.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><text x="550" y="148" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">Get: request a snapshot</text><path d="M132.0,230.0 L963.0,230.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><text x="550" y="218" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">Set: submit a transaction</text><path d="M963.0,310.0 L132.0,310.0" fill="none" stroke="#888888" stroke-width="3" marker-end="url(#a)" /><text x="550" y="294" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">Subscribe: receive updates over time</text></g></svg>