<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="335" viewBox="0 0 1100 335" role="img" aria-label="IPv6 path MTU discovery: router drops a 1500-byte packet, returns ICMPv6 Packet Too Big, sender resends with 1400 bytes"><title>IPv6 path MTU discovery: router drops a 1500-byte packet, returns ICMPv6 Packet Too Big, sender resends with 1400 bytes</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="150" y="27" font-size="26" text-anchor="middle" fill="#303030" font-weight="700">Sender</text><path d="M150,45 L150,250" fill="none" stroke="#888888" stroke-width="2" /><text x="550" y="27" font-size="26" text-anchor="middle" fill="#303030" font-weight="700">Router</text><path d="M550,45 L550,250" fill="none" stroke="#888888" stroke-width="2" /><text x="550" y="272" font-size="21" text-anchor="middle" fill="#666666" font-weight="400">next link: MTU 1400</text><text x="950" y="27" font-size="26" text-anchor="middle" fill="#303030" font-weight="700">Receiver</text><path d="M950,45 L950,250" fill="none" stroke="#888888" stroke-width="2" /><path d="M163.0,85.0 L537.0,85.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="350" y="72" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">1,500-byte packet</text><text x="575" y="92" font-size="26" text-anchor="start" fill="#303030" font-weight="700">✕</text><path d="M537.0,150.0 L163.0,150.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="350" y="137" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Packet Too Big: MTU 1400</text><path d="M163.0,215.0 L937.0,215.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="550" y="202" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">1,400-byte packets</text><text x="550" y="315" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">The router drops and reports. Only the sender makes packets smaller.</text></g></svg>