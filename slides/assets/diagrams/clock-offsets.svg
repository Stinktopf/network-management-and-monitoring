<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="Illustrative clock readings for one event; the clocks disagree by four seconds"><title>Illustrative clock readings for one event; the clocks disagree by four seconds</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="550" y="25" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Same event</text><path d="M550,85 L550,195" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="7 6" /><text x="10" y="93" font-size="25" text-anchor="start" font-weight="400" fill="#303030">Probe clock</text><path d="M225,85 L1040,85" fill="none" stroke="#888888" stroke-width="2" /><circle cx="550" cy="85" r="8" fill="#888888" stroke="#cccccc" stroke-width="2" /><text x="740" y="65" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">10:00:04</text><text x="10" y="203" font-size="25" text-anchor="start" font-weight="400" fill="#303030">Router clock</text><path d="M225,195 L1040,195" fill="none" stroke="#888888" stroke-width="2" /><circle cx="550" cy="195" r="8" fill="#888888" stroke="#cccccc" stroke-width="2" /><text x="740" y="175" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">10:00:08</text><text x="550" y="293" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">Unsynchronized clocks distort the apparent event order.</text></g></svg>