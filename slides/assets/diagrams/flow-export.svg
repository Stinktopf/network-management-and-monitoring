<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="235" viewBox="0 0 1100 235" role="img" aria-label="An entry leaves the cache when the flow ends or a timeout expires."><title>An entry leaves the cache when the flow ends or a timeout expires.</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="20.0" y="38" width="223.0" height="104" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="131.5" y="74.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Packets</text><text dominant-baseline="central" x="131.5" y="106.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">Read headers</text><path d="M255.0,90 L287.0,90" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><rect x="299.0" y="38" width="223.0" height="104" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="410.5" y="74.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Flow cache</text><text dominant-baseline="central" x="410.5" y="106.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">One entry per flow key</text><path d="M534.0,90 L566.0,90" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><rect x="578.0" y="38" width="223.0" height="104" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="689.5" y="74.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Exporter</text><text dominant-baseline="central" x="6