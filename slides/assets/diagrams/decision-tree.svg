<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Illustrative decision tree predicting link load from hour and weekday"><title>Illustrative decision tree predicting link load from hour and weekday</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="400" y="15" width="300" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="50.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Hour 8 to 18?</text><rect x="150" y="145" width="300" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="300.0" y="180.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Weekday?</text><rect x="700" y="145" width="300" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="850.0" y="164.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Low</text><text dominant-baseline="central" x="850.0" y="196.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">40 Mbit/s</text><rect x="20" y="275" width="280" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="160.0" y="294.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">High</text><text dominant-baseline="central" x="160.0" y="326.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">120 Mbit/s</text><rect x="330" y="275" width="280" height="70" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="470.0" y="294.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Medium</text><text dominant-baseline="central" x="470.0" y="326.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">80 Mbit/s</text><path d="M495.20317249214366,91.41083161995775 L334.79682750785634,138.58916838004225" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><path d="M604.8756642789573,91.10810551794484 L815.1243357210427,138.89189448205516" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="390" y="118" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">yes</text><text x="730" y="118" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">no</text><path d="M245.76000847997457,222.6499947000159 L174.23999152002543,267.3500052999841" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><path d="M354.4721359549996,222.2360679774998 L445.5278640450004,267.7639320225002" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="190" y="250" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">yes</text><text x="430" y="250" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">no</text><text x="830" y="300" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Leaves hold the prediction.</text><text x="830" y="333" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Training chooses the questions.</text></g></svg>