<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="355" viewBox="0 0 1100 355" role="img" aria-label="Schematic repeated-study confidence intervals around estimates. The fixed population mean is a vertical line. Some intervals miss it. Five drawn intervals do not represent an empirical 95 percent coverage rate."><title>Schematic repeated-study confidence intervals around estimates. The fixed population mean is a vertical line. Some intervals miss it. Five drawn intervals do not represent an empirical 95 percent coverage rate.</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="550" y="30" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Same study design, different independent samples</text><path d="M550,55 L550,255" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="8 6" /><text x="85" y="82" font-size="22" text-anchor="start" fill="#303030" font-weight="400">Study 1</text><path d="M330,75 L630,75" fill="none" stroke="#888888" stroke-width="2" /><circle cx="480" cy="75" r="6" fill="#303030" /><text x="85" y="122" font-size="22" text-anchor="start" fill="#303030" font-weight="400">Study 2</text><path d="M460,115 L770,115" fill="none" stroke="#888888" stroke-width="2" /><circle cx="615" cy="115" r="6" fill="#303030" /><text x="85" y="162" font-size="22" text-anchor="start" fill="#303030" font-weight="400">Study 3</text><path d="M300,155 L590,155" fill="none" stroke="#888888" stroke-width="2" /><circle cx="445" cy="155" r="6" fill="#303030" /><text x="85" y="202" font-size="22" text-anchor="start" fill="#303030" font-weight="400">Study 4</text><path d="M600,195 L910,195" fill="none" stroke="#888888" stroke-width="2" /><circle cx="755" cy="195" r="6" fill="#303030" /><text x="85" y="242" font-size="22" text-anchor="start" fill="#303030" font-weight="400">Study 5</text><path d="M400,235 L710,235" fill="none" stroke="#888888" stroke-width="2" /><circle cx="555" cy="235" r="6" fill="#303030" /><text x="550" y="290" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Fixed population mean</text><text x="550" y="330" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">Schematic intervals, not results from our five repair pairs</text></g></svg>