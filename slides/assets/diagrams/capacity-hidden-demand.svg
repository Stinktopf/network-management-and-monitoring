<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="325" viewBox="0 0 1100 325" role="img" aria-label="A 200 ms burst of 75 Mbit/s exceeds Lagoon capacity of 50 Mbit/s inside a 10 second counter interval. Mean output stays about 90 percent. With a small finite queue, the burst causes drops."><title>A 200 ms burst of 75 Mbit/s exceeds Lagoon capacity of 50 Mbit/s inside a 10 second counter interval. Mean output stays about 90 percent. With a small finite queue, the burst causes drops.</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="95" y="28" font-size="23" text-anchor="start" font-weight="400" fill="#303030">Offered traffic (Mbit/s)</text><path d="M95,237.0 L805,237.0" fill="none" stroke="#dddddd" stroke-width="1" /><text x="77" y="244.0" font-size="22" text-anchor="end" font-weight="400" fill="#303030">0</text><path d="M95,180.75 L805,180.75" fill="none" stroke="#dddddd" stroke-width="1" /><text x="77" y="187.75" font-size="22" text-anchor="end" font-weight="400" fill="#303030">25</text><path d="M95,124.5 L805,124.5" fill="none" stroke="#dddddd" stroke-width="1" /><text x="77" y="131.5" font-size="22" text-anchor="end" font-weight="400" fill="#303030">50</text><path d="M95,68.25 L805,68.25" fill="none" stroke="#dddddd" stroke-width="1" /><text x="77" y="75.25" font-size="22" text-anchor="end" font-weight="400" fill="#303030">75</text><path d="M95,57 L95,237" fill="none" stroke="#888888" stroke-width="2" /><path d="M95,237 L805,237" fill="none" stroke="#888888" stroke-width="2" /><rect x="443" y="68.25" width="14.199999999999989" height="56.25" rx="0" fill="#dddddd" stroke="none" stroke-width="1.5" /><path d="M95,124.5 L805,124.5" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="7 6" /><text x="595" y="111.5" font-size="22" text-anchor="middle" font-weight="400" fill="#303030">Capacity: 50 Mbit/s</text><path d="M95,135.75 H443 V68.25 H457.2 V135.75 H805" fill="none" stroke="#303030" stroke-width="3" /><text x="510" y="61" font-size="23" text-anchor="start" font-weight="700" fill="#303030">200 ms burst: 75 Mbit/s</text><path d="M495,65 L465,71.25" fill="none" stroke="#888888" stroke-width="2" /><text x="95" y="268" font-size="22" text-anchor="middle" font-weight="400" fill="#303030">0</text><text x="450" y="268" font-size="22" text-anchor="middle" font-weight="400" fill="#303030">5</text><text x="805" y="268" font-size="22" text-anchor="middle" font-weight="400" fill="#303030">10 s</text><text x="960" y="78" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Dashboard</text><text x="960" y="130" font-size="42" text-anchor="middle" font-weight="700" fill="#303030">≈90%</text><text x="960" y="170" font-size="23" text-anchor="middle" font-weight="400" fill="#303030">mean output</text><text x="960" y="201" font-size="23" text-anchor="middle" font-weight="400" fill="#303030">over 10 s</text><text x="550" y="307" font-size="23" text-anchor="middle" font-weight="400" fill="#303030">Synthetic Lagoon example. The brief peak is lost in the average.</text></g></svg>