<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-label="Synthetic spike averaged over progressively wider windows; all rows share the same vertical and temporal scale"><title>Synthetic spike averaged over progressively wider windows; all rows share the same vertical and temporal scale</title><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker><marker id="arrow-grey" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="15" y="65" font-size="24" text-anchor="start" fill="#303030" font-weight="400">Raw samples</text><path d="M280,95 L1050,95" fill="none" stroke="#dddddd" stroke-width="2" /><circle cx="310" cy="85" r="5" fill="#303030" /><circle cx="373" cy="85" r="5" fill="#303030" /><circle cx="436" cy="40" r="5" fill="#303030" /><circle cx="499" cy="85" r="5" fill="#303030" /><circle cx="562" cy="85" r="5" fill="#303030" /><circle cx="625" cy="85" r="5" fill="#303030" /><circle cx="688" cy="85" r="5" fill="#303030" /><circle cx="751" cy="85" r="5" fill="#303030" /><circle cx="814" cy="85" r="5" fill="#303030" /><circle cx="877" cy="85" r="5" fill="#303030" /><circle cx="940" cy="85" r="5" fill="#303030" /><circle cx="1003" cy="85" r="5" fill="#303030" /><text x="15" y="160" font-size="24" text-anchor="start" fill="#303030" font-weight="400">4-s means</text><path d="M280,190 L1050,190" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M287,168.75 L529,168.75" fill="none" stroke="#303030" stroke-width="2" /><path d="M539,180 L781,180" fill="none" stroke="#303030" stroke-width="2" /><path d="M791,180 L1033,180" fill="none" stroke="#303030" stroke-width="2" /><text x="15" y="255" font-size="24" text-anchor="start" fill="#303030" font-weight="400">12-s mean</text><path d="M280,285 L1050,285" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M287,271.25 L1033,271.25" fill="none" stroke="#303030" stroke-width="2" /><text x="1030" y="333" font-size="23" text-anchor="end" fill="#303030" font-weight="400">Same scales. Twelve seconds per row.</text></g></svg>