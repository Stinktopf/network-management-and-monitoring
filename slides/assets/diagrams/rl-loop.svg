<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="285" viewBox="0 0 1100 285" role="img" aria-label="Reinforcement learning loop: the agent sends an action to the environment and receives a new state and a reward"><title>Reinforcement learning loop: the agent sends an action to the environment and receives a new state and a reward</title><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker><marker id="arrow-grey" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="60" y="80" width="330" height="110" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="225.0" y="119.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Agent</text><text dominant-baseline="central" x="225.0" y="151.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">policy</text><rect x="710" y="80" width="330" height="110" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="875.0" y="119.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Environment</text><text dominant-baseline="central" x="875.0" y="151.0" font-size="22" text-anchor="middle" fill="#666666" font-weight="400">the network</text><path d="M400.0,105.0 L698.0,105.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="550" y="90" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">action</text><path d="M698.0,165.0 L400.0,165.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="550" y="200" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">new state + reward</text><text x="550" y="265" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Goal: the highest total reward over time.</text></g></svg>