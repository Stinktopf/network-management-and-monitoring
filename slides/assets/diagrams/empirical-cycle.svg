<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="345" viewBox="0 0 1100 345" role="img" aria-label="Empirical cycle: observe, question, hypothesis, prediction, experiment, analysis, claim, review"><title>Empirical cycle: observe, question, hypothesis, prediction, experiment, analysis, claim, review</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="40" y="48" font-size="22" text-anchor="start" fill="#666666" font-weight="700">01</text><text x="140" y="85" font-size="29" text-anchor="middle" fill="#303030" font-weight="700">Observe</text><path d="M40,105 L240,105" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M248,79 L293,79" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="315" y="48" font-size="22" text-anchor="start" fill="#666666" font-weight="700">02</text><text x="415" y="85" font-size="29" text-anchor="middle" fill="#303030" font-weight="700">Question</text><path d="M315,105 L515,105" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M523,79 L568,79" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="590" y="48" font-size="22" text-anchor="start" fill="#666666" font-weight="700">03</text><text x="690" y="85" font-size="29" text-anchor="middle" fill="#303030" font-weight="700">Hypothesis</text><path d="M590,105 L790,105" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M798,79 L843,79" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="865" y="48" font-size="22" text-anchor="start" fill="#666666" font-weight="700">04</text><text x="965" y="85" font-size="29" text-anchor="middle" fill="#303030" font-weight="700">Prediction</text><path d="M865,105 L1065,105" fill="none" stroke="#dddddd" stroke-width="2" /><text x="40" y="203" font-size="22" text-anchor="start" fill="#666666" font-weight="700">05</text><text x="140" y="240" font-size="29" text-anchor="middle" fill="#303030" font-weight="700">Experiment</text><path d="M40,260 L240,260" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M248,234 L293,234" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="315" y="203" font-size="22" text-anchor="start" fill="#666666" font-weight="700">06</text><text x="415" y="240" font-size="29" text-anchor="middle" fill="#303030" font-weight="700">Analysis</text><path d="M315,260 L515,260" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M523,234 L568,234" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="590" y="203" font-size="22" text-anchor="start" fill="#666666" font-weight="700">07</text><text x="690" y="240" font-size="29" text-anchor="middle" fill="#303030" font-weight="700">Claim</text><path d="M590,260 L790,260" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M798,234 L843,234" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="865" y="203" font-size="22" text-anchor="start" fill="#666666" font-weight="700">08</text><text x="965" y="240" font-size="29" text-anchor="middle" fill="#303030" font-weight="700">Review</text><path d="M865,260 L1065,260" fill="none" stroke="#dddddd" stroke-width="2" /><path d="M1080,79 V145 H15 V214 H27" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="550" y="319" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Review leads to new observations. A failed prediction is a result too.</text></g></svg>