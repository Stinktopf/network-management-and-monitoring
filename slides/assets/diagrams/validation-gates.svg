<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-label="validation-gates"><title>validation-gates</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="20.0" y="45" width="316.0" height="105" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="178.0" y="81.5" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Syntax</text><text dominant-baseline="central" x="178.0" y="113.5" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">Can it be parsed?</text><path d="M348.0,97 L380.0,97" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><rect x="392.0" y="45" width="316.0" height="105" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="81.5" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Semantics</text><text dominant-baseline="central" x="550.0" y="113.5" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">Does it mean something?</text><path d="M720.0,97 L752.0,97" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><rect x="764.0" y="45" width="316.0" height="105" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="922.0" y="81.5" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Policy</text><text dominant-baseline="central" x="922.0" y="113.5" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">Is that behavior allowed?</text><text x="550" y="215" font-size="24" text-anchor="middle" font-weight="400" fill="#303030">A valid configuration can still violate the change contract.</text></g></svg>