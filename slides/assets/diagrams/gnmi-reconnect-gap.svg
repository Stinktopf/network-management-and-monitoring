<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="225" viewBox="0 0 1100 225" role="img" aria-label="Explanatory course diagram"><title>Explanatory course diagram</title><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker><marker id="arrow-grey" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="20" y="45" width="275" height="80" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="157.5" y="85.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Synchronized state</text><rect x="410" y="45" width="280" height="80" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="85.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Connection gap</text><rect x="805" y="45" width="275" height="80" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="942.5" y="85.0" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">Fresh snapshot</text><path d="M305.0,85.0 L400.0,85.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" stroke-dasharray="8 6" /><path d="M700.0,85.0 L795.0,85.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" stroke-dasharray="8 6" /><text x="550" y="193" font-size="27" text-anchor="middle" fill="#303030" font-weight="400">Events during the gap may be irretrievable.</text></g></svg>