<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-label="Illustrative offered rate 60 Mbit/s across a 50 Mbit/s transit link; delivered rate cannot exceed the limit"><title>Illustrative offered rate 60 Mbit/s across a 50 Mbit/s transit link; delivered rate cannot exceed the limit</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="125" y="40" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">Lagoon probe</text><text x="550" y="40" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">Lagoon handoff</text><text x="975" y="40" font-size="27" text-anchor="middle" font-weight="700" fill="#303030">Ocean Research</text><text x="125" y="88" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">60 Mbit/s</text><text x="550" y="88" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">50 Mbit/s limit</text><text x="975" y="88" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">≤ 50 Mbit/s</text><path d="M45,141 L405,141" fill="none" stroke="#888888" stroke-width="24" /><path d="M695,141 L1060,141" fill="none" stroke="#888888" stroke-width="20" /><path d="M408,109 H695 V173 H408 Z" fill="#ffffff" stroke="#888888" stroke-width="2" /><path d="M550.0,184.0 L550.0,239.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><text x="550" y="279" font-size="25" text-anchor="middle" font-weight="400" fill="#303030">Excess: queue, drop or sender backpressure</text></g></svg>