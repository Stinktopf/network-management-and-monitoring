<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-label="Management Plane configures and monitors. Control Plane learns and selects routes. Data Plane forwards packets."><title>Management Plane configures and monitors. Control Plane learns and selects routes. Data Plane forwards packets.</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="20" y="12" width="1060" height="76" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" /><path d="M20,14 L20,86" fill="none" stroke="#888888" stroke-width="4" /><text x="48" y="59" font-size="25" text-anchor="start" font-weight="700" fill="#303030">Management Plane</text><text x="370" y="59" font-size="24" text-anchor="start" font-weight="400" fill="#303030">Configure and monitor</text><text x="1035" y="59" font-size="23" text-anchor="end" font-weight="400" fill="#666666">CLI, gNMI, SNMP</text><rect x="20" y="104" width="1060" height="76" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" /><path d="M20,106 L20,178" fill="none" stroke="#888888" stroke-width="4" /><text x="48" y="151" font-size="25" text-anchor="start" font-weight="700" fill="#303030">Control Plane</text><text x="370" y="151" font-size="24" text-anchor="start" font-weight="400" fill="#303030">Learn and select routes</text><text x="1035" y="151" font-size="23" text-anchor="end" font-weight="400" fill="#666666">OSPF, BGP</text><rect x="20" y="196" width="1060" height="76" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" /><path d="M20,198 L20,270" fill="none" stroke="#888888" stroke-width="4" /><text x="48" y="243" font-size="25" text-anchor="start" font-weight="700" fill="#303030">Data Plane</text><text x="370" y="243" font-size="24" text-anchor="start" font-weight="400" fill="#303030">Forward packets</text><text x="1035" y="243" font-size="23" text-anchor="end" font-weight="400" fill="#666666">IP packets, Ethernet frames</text></g></svg>