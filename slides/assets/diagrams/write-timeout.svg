<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="305" viewBox="0 0 1100 305" role="img" aria-label="Explanatory course diagram"><title>Explanatory course diagram</title><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker><marker id="arrow-grey" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="200" y="25" font-size="26" text-anchor="middle" fill="#303030" font-weight="700">Client</text><text x="850" y="25" font-size="26" text-anchor="middle" fill="#303030" font-weight="700">Target</text><path d="M200,40 L200,235" fill="none" stroke="#888888" stroke-width="2" /><path d="M850,40 L850,235" fill="none" stroke="#888888" stroke-width="2" /><path d="M213.0,75.0 L837.0,75.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="500" y="62" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Write request</text><rect x="735" y="105" width="260" height="55" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="865.0" y="132.5" font-size="25" text-anchor="middle" fill="#303030" font-weight="700">State changed</text><path d="M837.0,190.0 L435.0,190.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" stroke-dasharray="8 6" /><text x="580" y="177" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Reply lost</text><text x="260" y="222" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Timeout</text><text x="550" y="282" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Unknown outcome ≠ no change. Read before retrying.</text></g></svg>