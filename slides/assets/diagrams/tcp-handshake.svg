<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="305" viewBox="0 0 1100 305" role="img" aria-label="Explanatory course diagram"><title>Explanatory course diagram</title><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker><marker id="arrow-grey" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="240" y="27" font-size="26" text-anchor="middle" fill="#303030" font-weight="700">Client</text><text x="860" y="27" font-size="26" text-anchor="middle" fill="#303030" font-weight="700">Target</text><path d="M240,45 L240,245" fill="none" stroke="#888888" stroke-width="2" /><path d="M860,45 L860,245" fill="none" stroke="#888888" stroke-width="2" /><path d="M253.0,75.0 L847.0,75.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="550" y="63" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">SYN</text><path d="M847.0,137.0 L253.0,137.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="550" y="125" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">SYN + ACK</text><path d="M253.0,199.0 L847.0,199.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="550" y="187" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">ACK</text><text x="550" y="283" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">TCP setup precedes the application response.</text></g></svg>