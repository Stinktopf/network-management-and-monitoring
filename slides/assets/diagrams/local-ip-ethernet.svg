<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="335" viewBox="0 0 1100 335" role="img" aria-label="Two hosts on one VLAN. ARP resolves the destination MAC. The switch forwards an Ethernet frame containing the IP packet."><title>Two hosts on one VLAN. ARP resolves the destination MAC. The switch forwards an Ethernet frame containing the IP packet.</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><rect x="20" y="10" width="240" height="80" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="140.0" y="34.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">PC A</text><text dominant-baseline="central" x="140.0" y="66.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">192.168.1.10/24</text><rect x="430" y="10" width="240" height="80" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="550.0" y="34.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Switch</text><text dominant-baseline="central" x="550.0" y="66.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">Forwards by MAC</text><rect x="840" y="10" width="240" height="80" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text dominant-baseline="central" x="960.0" y="34.0" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">PC B</text><text dominant-baseline="central" x="960.0" y="66.0" font-size="22" text-anchor="middle" font-weight="400" fill="#666666">192.168.1.20/24</text><path d="M275.0,50.0 L415.0,50.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><path d="M685.0,50.0 L825.0,50.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a-grey)" /><rect x="210" y="120" width="680" height="110" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" /><text x="550" y="151" font-size="25" text-anchor="middle" font-weight="700" fill="#303030">Ethernet frame: MAC A → MAC B</text><rect x="240" y="171" width="620" height="42" rx="5" fill="#f6f6f6" stroke="#cccccc" stroke-width="1.5" /><text x="550" y="199" font-size="24" text-anchor="middle" font-weight="400" fill="#303030">IP packet: 192.168.1.10 → 192.168.1.20</text><text x="185" y="276" font-size="24" text-anchor="middle" font-weight="700" fill="#303030">1  Route lookup</text><text x="185" y="310" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">Same subnet → direct delivery</text><text x="550" y="276" font-size="24" text-anchor="middle" font-weight="700" fill="#303030">2  ARP if MAC is unknown</text><text x="550" y="310" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">Broadcast request, unicast reply</text><text x="915" y="276" font-size="24" text-anchor="middle" font-weight="700" fill="#303030">3  Send the frame</text><text x="915" y="310" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">Known MAC B → only B’s port</text></g></svg>