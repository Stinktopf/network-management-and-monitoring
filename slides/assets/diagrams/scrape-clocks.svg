<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="Probe results and Prometheus scrapes on separate clocks; the scrapes at 2.5 s and 3.5 s return the same result"><title>Probe results and Prometheus scrapes on separate clocks; the scrapes at 2.5 s and 3.5 s return the same result</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="20" y="87" font-size="24" text-anchor="start" fill="#303030" font-weight="400">Probe results</text><text x="20" y="192" font-size="24" text-anchor="start" fill="#303030" font-weight="400">Scrapes</text><rect x="741.0" y="66" width="170.0" height="28" fill="#f6f6f6" /><path d="M180,80 L1040,80" fill="none" stroke="#888888" stroke-width="2" /><path d="M180,185 L1040,185" fill="none" stroke="#888888" stroke-width="2" /><path d="M265.0,177 L197.0,88" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="8 6" /><path d="M435.0,177 L384.0,88" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="8 6" /><path d="M605.0,177 L571.0,88" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="8 6" /><path d="M775.0,177 L571.0,88" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="8 6" /><path d="M945.0,177 L911.0,88" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="8 6" /><circle cx="197.0" cy="80" r="9" fill="#303030" /><circle cx="384.0" cy="80" r="9" fill="#303030" /><circle cx="571.0" cy="80" r="9" fill="#303030" /><circle cx="911.0" cy="80" r="9" fill="#ffffff" stroke="#303030" stroke-width="3" /><text x="911.0" y="55" font-