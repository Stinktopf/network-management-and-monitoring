<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-label="Illustrative traceroute replies: one reply per hop, RTT 2, 100, 14 and 18 milliseconds"><title>Illustrative traceroute replies: one reply per hop, RTT 2, 100, 14 and 18 milliseconds</title><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker><marker id="a-grey" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="20" y="25" font-size="24" text-anchor="start" font-weight="400" fill="#666666">One illustrative reply per hop</text><text x="20" y="88" font-size="26" text-anchor="start" font-weight="400" fill="#303030">Hop 1</text><path d="M195,80 L1010,80" fill="none" stroke="#dddddd" stroke-width="2" /><circle cx="208.2" cy="80" r="8" fill="#303030" stroke="#303030" stroke-width="2" /><text x="230.2" y="66" font-size="25" text-anchor="start" font-weight="700" fill="#303030">2 ms</text><text x="20" y="151" font-size="26" text-anchor="start" font-weight="400" fill="#303030">Hop 2</text><path d="M195,143 L1010,143" fill="none" stroke="#dddddd" stroke-width="2" /><circle cx="855.0" cy="143" r="8" fill="#303030" stroke="#303030" stroke-width="2" /><text x="877.0" y="129" font-size="25" text-anchor="start" font-weight="700" fill="#303030">100 ms</text><text x="20" y="214" font-size="26" text-anchor="start" font-weight="400" fill="#303030">Hop 3</text><path d="M195,206 L1010,206" fill="none" stroke="#dddddd" stroke-width="2" /><circle cx="287.4" cy="206" r="8" fill="#303030" stroke="#303030" stroke-width="2" /><text x="309.4" y="192" font-size="25" text-anchor="start" font-weight="700" fill="#303030">14 ms</text><text x="20" y="277" font-size="26" text-anchor="start" font-weight="400" fill="#303030">Hop 4</text><path d="M195,269 L1010,269" fill="none" stroke="#dddddd" stroke-width="2" /><circle cx="313.8" cy="269" r="8" fill="#303030" stroke="#303030" stroke-width="2" /><text x="335.8" y="255" font-size="25" text-anchor="start" font-weight="700" fill="#303030">18 ms</text><text x="195.0" y="319" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">0</text><text x="327.0" y="319" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">20</text><text x="459.0" y="319" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">40</text><text x="591.0" y="319" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">60</text><text x="723.0" y="319" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">80</text><text x="855.0" y="319" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">100</text><text x="987.0" y="319" font-size="21" text-anchor="middle" font-weight="400" fill="#303030">120</text><text x="1030" y="357" font-size="24" text-anchor="end" font-weight="400" fill="#303030">Reply RTT (ms)</text></g></svg>