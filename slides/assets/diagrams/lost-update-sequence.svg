<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="305" viewBox="0 0 1100 305" role="img" aria-label="Explanatory course diagram"><title>Explanatory course diagram</title><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker><marker id="arrow-grey" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><text x="120" y="25" font-size="24" text-anchor="middle" fill="#303030" font-weight="700">Writer A</text><text x="600" y="25" font-size="24" text-anchor="middle" fill="#303030" font-weight="700">State owner</text><text x="995" y="25" font-size="24" text-anchor="middle" fill="#303030" font-weight="700">Writer B</text><path d="M120,45 L120,245" fill="none" stroke="#888888" stroke-width="2" /><path d="M600,45 L600,245" fill="none" stroke="#888888" stroke-width="2" /><path d="M995,45 L995,245" fill="none" stroke="#888888" stroke-width="2" /><path d="M587.0,78.0 L133.0,78.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="350" y="65" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">Read: version 7</text><path d="M982.0,135.0 L613.0,135.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="810" y="123" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">Update → version 8</text><path d="M133.0,195.0 L587.0,195.0" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)" /><text x="350" y="180" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">Write if version = 7</text><text x="790" y="210" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">Rejected: stale version</text><text x="550" y="282" font-size="24" text-anchor="middle" fill="#303030" font-weight="400">Check and write must be atomic at the state owner.</text></g></svg>