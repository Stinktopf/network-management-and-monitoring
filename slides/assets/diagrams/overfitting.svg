<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-label="Training error falls with model complexity while test error first falls and then rises"><title>Training error falls with model complexity while test error first falls and then rises</title><defs><marker id="arrow" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker><marker id="arrow-grey" viewBox="-1 -1 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><g font-family="Arial, Liberation Sans, sans-serif"><path d="M110,270 L1000,270" fill="none" stroke="#888888" stroke-width="2" /><path d="M110,270 L110,30" fill="none" stroke="#888888" stroke-width="2" /><text x="555" y="302" font-size="23" text-anchor="middle" fill="#303030" font-weight="400">Model complexity →</text><text x="120" y="25" font-size="23" text-anchor="start" fill="#303030" font-weight="400">Error</text><path d="M130,80 C330,190 600,235 980,252" fill="none" stroke="#888888" stroke-width="3" stroke-dasharray="8 6" /><path d="M130,60 C330,170 470,190 560,185 C700,175 850,115 980,65" fill="none" stroke="#303030" stroke-width="3" /><text x="985" y="232" font-size="22" text-anchor="end" fill="#303030" font-weight="400">Training error</text><text x="985" y="52" font-size="22" text-anchor="end" fill="#303030" font-weight="400">Test error</text><path d="M545,195 L545,270" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="8 6" /><text x="200" y="335" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">Underfit</text><text x="545" y="335" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">Best on held-out data</text><text x="900" y="335" font-size="22" text-anchor="middle" fill="#303030" font-weight="400">Overfit</text></g></svg