# AI5049 edge01.bob1.oceanresearch.test - customer edge, AS65010

set / routing-policy prefix-set LOCAL-SERVICE prefix 198.51.100.0/24 mask-length-range exact
set / routing-policy prefix-set LOCAL-SERVICE prefix 2001:db8:100::/48 mask-length-range exact
set / routing-policy policy EXPORT-LOCAL default-action policy-result reject
set / routing-policy policy EXPORT-LOCAL statement 10 match prefix prefix-set LOCAL-SERVICE
set / routing-policy policy EXPORT-LOCAL statement 10 action policy-result accept

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description to-edge01.bob1.reefnet.test
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 192.0.2.0/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv6 address 2001:db8:0:10::/127

set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description to-service01.bob1.oceanresearch.test
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 198.51.100.1/24
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv6 address 2001:db8:100::1/48

set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.255.10.1/32

set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface system0.0

set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65010
set / network-instance default protocols bgp router-id 10.255.10.1
set / network-instance default protocols bgp ebgp-default-policy import-reject-all false
set / network-instance default protocols bgp ebgp-default-policy export-reject-all false
set / network-instance default protocols bgp export-policy [ EXPORT-LOCAL ]
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable

set / network-instance default protocols bgp group provider-v4 peer-as 65000
set / network-instance default protocols bgp group provider-v4 afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group provider-v4 afi-safi ipv6-unicast admin-state disable
set / network-instance default protocols bgp neighbor 192.0.2.1 admin-state enable
set / network-instance default protocols bgp neighbor 192.0.2.1 peer-group provider-v4

set / network-instance default protocols bgp group provider-v6 peer-as 65000
set / network-instance default protocols bgp group provider-v6 afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group provider-v6 afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:10::1 admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:10::1 peer-group provider-v6

set / system logging network-instance mgmt
set / system logging remote-server 172.20.20.45 transport udp
set / system logging remote-server 172.20.20.45 remote-port 1514
set / system logging remote-server 172.20.20.45 facility local6 priority match-above informational

# Prometheus reads Linux capacity-queue counters over the management network.
set / acl acl-filter cpm type ipv4 entry 900 description "ReefNet queue exporter from Prometheus"
set / acl acl-filter cpm type ipv4 entry 900 match ipv4 protocol tcp
set / acl acl-filter cpm type ipv4 entry 900 match ipv4 source-ip prefix 172.20.20.42/32
set / acl acl-filter cpm type ipv4 entry 900 match transport destination-port operator eq
set / acl acl-filter cpm type ipv4 entry 900 match transport destination-port value 9101
set / acl acl-filter cpm type ipv4 entry 900 action accept
