# AI5049 edge02.bob1.reefnet.test - provider edge, AS65000

set / routing-policy policy EXPORT-BGP default-action policy-result reject
set / routing-policy policy EXPORT-BGP statement 10 match protocol bgp
set / routing-policy policy EXPORT-BGP statement 10 action policy-result accept

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description to-edge01.bob1.reefnet.test-core-a
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.0.1/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv6 address 2001:db8:0:12::1/127

set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description to-edge01.bob1.pacifictransit.test
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 192.0.2.4/31
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv6 address 2001:db8:0:b::/127

set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description to-edge01.bob1.reefnet.test-core-b
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.0.0.3/31
set / interface ethernet-1/3 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv6 address 2001:db8:0:14::1/127

set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.255.0.2/32

set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0

set / network-instance default protocols ospf instance default admin-state enable
set / network-instance default protocols ospf instance default version ospf-v2
set / network-instance default protocols ospf instance default router-id 10.255.0.2
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/1.0 admin-state enable
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/3.0 admin-state enable
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/3.0 interface-type point-to-point
set / network-instance default protocols ospf instance default area 0.0.0.0 interface system0.0 admin-state enable

set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65000
set / network-instance default protocols bgp router-id 10.255.0.2
set / network-instance default protocols bgp ebgp-default-policy import-reject-all false
set / network-instance default protocols bgp ebgp-default-policy export-reject-all false
set / network-instance default protocols bgp export-policy [ EXPORT-BGP ]
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable

set / network-instance default protocols bgp group ibgp-v4 peer-as 65000
set / network-instance default protocols bgp group ibgp-v4 afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ibgp-v4 afi-safi ipv6-unicast admin-state disable
set / network-instance default protocols bgp neighbor 10.255.0.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.0.1 peer-group ibgp-v4
set / network-instance default protocols bgp neighbor 10.255.0.1 transport local-address 10.255.0.2
set / network-instance default protocols bgp neighbor 10.255.0.1 next-hop-self true

set / network-instance default protocols bgp group ibgp-v6 peer-as 65000
set / network-instance default protocols bgp group ibgp-v6 afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group ibgp-v6 afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:12:: admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:12:: peer-group ibgp-v6
set / network-instance default protocols bgp neighbor 2001:db8:0:12:: next-hop-self true

set / network-instance default protocols bgp group pacific-v4 peer-as 65200
set / network-instance default protocols bgp group pacific-v4 afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp neighbor 192.0.2.5 admin-state enable
set / network-instance default protocols bgp neighbor 192.0.2.5 peer-group pacific-v4

set / network-instance default protocols bgp group pacific-v6 peer-as 65200
set / network-instance default protocols bgp group pacific-v6 afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:b::1 admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:b::1 peer-group pacific-v6

set / system logging network-instance mgmt
set / system logging remote-server 172.20.20.45 transport udp
set / system logging remote-server 172.20.20.45 remote-port 1514
set / system logging remote-server 172.20.20.45 facility local6 priority match-above informational

# Prometheus reads Linux capacity-queue counters over the management network.
set / acl acl-filter cpm type ipv4 entry 900 description "ReefNet queue exporter from Prometheus"
set / acl acl-filter cpm type ipv4 entry 900 match ipv4 protocol tcp
set / acl acl-filter cpm type ipv4 entry 900 match ipv4 source-ip prefix 172.20.20.42/32
set / acl acl-filter cpm type ipv4 entry 900 match transport destination-port operator eq
set / acl acl-filter cpm type ipv4 entry 900 match transport destination-port value 9101
set / acl acl-filter cpm type ipv4 entry 900 action accept
