# AI5049 edge01.bob1.reefnet.test - provider edge, AS65000

set / routing-policy policy EXPORT-BGP default-action policy-result reject
set / routing-policy policy EXPORT-BGP statement 10 match protocol bgp
set / routing-policy policy EXPORT-BGP statement 10 action policy-result accept

set / routing-policy prefix-set CUSTOMER-V4 prefix 198.51.100.0/24 mask-length-range exact
set / routing-policy policy BLOCK-CUSTOMER-V4 default-action policy-result reject
set / routing-policy policy BLOCK-CUSTOMER-V4 statement 10 match prefix prefix-set CUSTOMER-V4
set / routing-policy policy BLOCK-CUSTOMER-V4 statement 10 action policy-result reject
set / routing-policy policy BLOCK-CUSTOMER-V4 statement 20 match protocol bgp
set / routing-policy policy BLOCK-CUSTOMER-V4 statement 20 action policy-result accept

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description to-edge01.bob1.oceanresearch.test
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 192.0.2.1/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv6 address 2001:db8:0:10::1/127

set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description to-edge02.bob1.reefnet.test-core-a
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.0.0/31
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv6 address 2001:db8:0:12::/127

set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description to-edge01.bob1.lagoontransit.test
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 192.0.2.3/31
set / interface ethernet-1/3 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv6 address 2001:db8:0:a::1/127

set / interface ethernet-1/4 admin-state enable
set / interface ethernet-1/4 description to-edge02.bob1.reefnet.test-core-b
set / interface ethernet-1/4 subinterface 0 admin-state enable
set / interface ethernet-1/4 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/4 subinterface 0 ipv4 address 10.0.0.2/31
set / interface ethernet-1/4 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/4 subinterface 0 ipv6 address 2001:db8:0:14::/127

set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.255.0.1/32

set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface ethernet-1/4.0
set / network-instance default interface system0.0

# OSPF provides internal reachability and two equal-cost core paths.
set / network-instance default protocols ospf instance default admin-state enable
set / network-instance default protocols ospf instance default version ospf-v2
set / network-instance default protocols ospf instance default router-id 10.255.0.1
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/2.0 admin-state enable
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/2.0 interface-type point-to-point
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/4.0 admin-state enable
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/4.0 interface-type point-to-point
set / network-instance default protocols ospf instance default area 0.0.0.0 interface system0.0 admin-state enable

set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65000
set / network-instance default protocols bgp router-id 10.255.0.1
set / network-instance default protocols bgp ebgp-default-policy import-reject-all false
set / network-instance default protocols bgp ebgp-default-policy export-reject-all false
set / network-instance default protocols bgp export-policy [ EXPORT-BGP ]
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable

set / network-instance default protocols bgp group ibgp-v4 peer-as 65000
set / network-instance default protocols bgp group ibgp-v4 afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ibgp-v4 afi-safi ipv6-unicast admin-state disable
set / network-instance default protocols bgp neighbor 10.255.0.2 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.0.2 peer-group ibgp-v4
set / network-instance default protocols bgp neighbor 10.255.0.2 transport local-address 10.255.0.1
set / network-instance default protocols bgp neighbor 10.255.0.2 next-hop-self true

set / network-instance default protocols bgp group ibgp-v6 peer-as 65000
set / network-instance default protocols bgp group ibgp-v6 afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group ibgp-v6 afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:12::1 admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:12::1 peer-group ibgp-v6
set / network-instance default protocols bgp neighbor 2001:db8:0:12::1 next-hop-self true

set / network-instance default protocols bgp group oceanresearch-v4 peer-as 65010
set / network-instance default protocols bgp group oceanresearch-v4 afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp neighbor 192.0.2.0 admin-state enable
set / network-instance default protocols bgp neighbor 192.0.2.0 peer-group oceanresearch-v4

set / network-instance default protocols bgp group oceanresearch-v6 peer-as 65010
set / network-instance default protocols bgp group oceanresearch-v6 afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:10:: admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:10:: peer-group oceanresearch-v6

set / network-instance default protocols bgp group lagoon-v4 peer-as 65100
set / network-instance default protocols bgp group lagoon-v4 afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp neighbor 192.0.2.2 admin-state enable
set / network-instance default protocols bgp neighbor 192.0.2.2 peer-group lagoon-v4

set / network-instance default protocols bgp group lagoon-v6 peer-as 65100
set / network-instance default protocols bgp group lagoon-v6 afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:a:: admin-state enable
set / network-instance default protocols bgp neighbor 2001:db8:0:a:: peer-group lagoon-v6

set / system logging network-instance mgmt
set / system logging remote-server 172.20.20.45 transport udp
set / system logging remote-server 172.20.20.45 remote-port 1514
set / system logging remote-server 172.20.20.45 facility local6 priority match-above informational

# Prometheus reads Linux capacity-queue counters over the management network.
set / acl acl-filter cpm type ipv4 entry 900 description "ReefNet queue exporter from Prometheus"
set / acl acl-filter cpm type ipv4 entry 900 match ipv4 protocol tcp
set / acl acl-filter cpm type ipv4 entry 900 match ipv4 source-ip prefix 172.20.20.42/32
set / acl acl-filter cpm type ipv4 entry 900 match transport destination-port operator eq
set / acl acl-filter cpm type ipv4 entry 900 match transport destination-port value 9101
set / acl acl-filter cpm type ipv4 entry 900 action accept
